name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - web/**
      - deploy/**
      - docker-compose.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            git pull origin main
            docker compose \
              --env-file deploy/.env.prod \
              -f deploy/docker-compose.prod.yml \
              up -d --build
