name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - web/**
      - deploy/**
      - package.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            git pull origin main

            echo "--- Building backend ---"
            cd backend
            npm install
            npm run build
            cd ..

            echo "--- Restarting backend ---"
            pm2 restart tickr-backend

            echo "--- Building web ---"
            cd web
            rm -rf .next
            npm install
            npm run build && pm2 restart tickr-web || echo "Web build skipped / failed"
